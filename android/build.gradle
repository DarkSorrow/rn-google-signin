def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RnGoogleSignin_" + name]).toInteger()
}

apply plugin: "com.android.library"

// AGP 9 ships built-in Kotlin; only apply the standalone plugin when it isn't already active
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

android {
  namespace "com.novastera.rngooglesignin"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"

  // Credential Manager + Sign in with Google
  implementation "androidx.credentials:credentials:1.6.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
  // googleid 1.2.1 ships Kotlin 2.4 metadata, which RN 0.88's Kotlin 2.2 compiler can't read.
  implementation "com.google.android.libraries.identity.googleid:googleid:1.2.0"

  // Google Play Services (22.x removed the legacy GoogleSignIn APIs, which this module doesn't use)
  implementation "com.google.android.gms:play-services-identity:18.1.0"
  implementation "com.google.android.gms:play-services-auth:22.0.0"
}

react {
  jsRootDir = file("../src/")
  libraryName = "RnGoogleSignin"
  codegenJavaPackageName = "com.novastera.rngooglesignin"
}
